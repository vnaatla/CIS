<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CIS</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!-- The chosen colour theme (ThemeService, key cis.theme), applied before the app starts so there is no flash of the default. -->
    <script>
      try {
        var t = localStorage.getItem('cis.theme')
        if (t === 'navy') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
